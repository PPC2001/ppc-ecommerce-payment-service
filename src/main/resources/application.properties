spring.application.name=ppc-ecommerce-payment-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Servlet Context Path (Matches Repository Name)
server.servlet.context-path=/ppc-ecommerce-payment-service

# Server Port
server.port=${PORT:8083}

# Actuator Health Check for ALB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
