name: Deploy Payment Service to AWS ECS

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ppc-ecommerce-payment-service
  ECS_CLUSTER: pratik-dev-cluster
  ECS_SERVICE: ppc-ecommerce-payment-service-dev
  CONTAINER_NAME: ppc-ecommerce-payment-service
  IAC_ENV_FILE: .iac/tfvars.dev.json

jobs:
  build-and-validate:
    name: Build & Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkout Common SDK
        uses: actions/checkout@v4
        with:
          repository: PPC2001/ppc-ecommerce-common-sdk
          path: ppc-ecommerce-common-sdk

      - name: Build & Install Common SDK
        run: mvn clean install -DskipTests --settings settings.xml
        working-directory: ppc-ecommerce-common-sdk
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests & Build Payment Service JAR
        run: mvn clean package --settings settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-ecs:
    name: Deploy to AWS ECS
    needs: build-and-validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkout Common SDK
        uses: actions/checkout@v4
        with:
          repository: PPC2001/ppc-ecommerce-common-sdk
          path: ppc-ecommerce-common-sdk

      - name: Build & Install Common SDK
        run: mvn clean install -DskipTests --settings settings.xml
        working-directory: ppc-ecommerce-common-sdk
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Payment Service JAR
        run: mvn clean package -DskipTests --settings settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render Task Definition Template
        id: render-task-def
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' $IAC_ENV_FILE)
          TASK_FAMILY="ppc-ecommerce-payment-task-dev"
          CPU=$(jq -r '.task_definition.cpu' $IAC_ENV_FILE)
          MEMORY=$(jq -r '.task_definition.memory' $IAC_ENV_FILE)
          CONTAINER_PORT=$(jq -r '.task_definition.environments.PORT' $IAC_ENV_FILE)
          
          sed \
            -e "s/\${TASK_FAMILY}/$TASK_FAMILY/g" \
            -e "s/\${CPU}/$CPU/g" \
            -e "s/\${MEMORY}/$MEMORY/g" \
            -e "s/\${AWS_ACCOUNT_ID}/$ACCOUNT_ID/g" \
            -e "s/\${AWS_REGION}/$AWS_REGION/g" \
            -e "s/\${CONTAINER_NAME}/$CONTAINER_NAME/g" \
            -e "s|\${ECR_IMAGE_URI}|$IMAGE_URI|g" \
            -e "s/\${CONTAINER_PORT}/$CONTAINER_PORT/g" \
            -e "s/\${SPRING_PROFILES_ACTIVE}/dev/g" \
            -e "s/\${PORT}/$CONTAINER_PORT/g" \
            -e "s/\${GIT_COMMIT_HASH}/$GIT_SHA/g" \
            .iac/task-definition-template.json > task-definition.json

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
